<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="theme-color" content="#010101" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="index, follow" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="https://www.nusuntian.com/" />
    <link rel="preload" as="image" href="/ian-bg.webp" imagesizes="100vw" />

    <!-- Performance: preconnects for analytics and commerce endpoints -->
    <link
      rel="preconnect"
      href="https://www.googletagmanager.com"
      crossorigin
    />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link
      rel="preconnect"
      href="https://www.google-analytics.com"
      crossorigin
    />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />
    <link
      rel="preconnect"
      href="https://ianheadquarters.myshopify.com"
      crossorigin
    />
    <link rel="dns-prefetch" href="https://ianheadquarters.myshopify.com" />
    <meta
      name="google-site-verification"
      content="5HAEhaXZ9y_D5g3_LJE6oOJmg0ZSgo_tVKPwp8oUtvQ"
    />
    <link
      href="./src/assets/fonts/Nohemi/font.css"
      rel="stylesheet"
      type="text/css"
    />
    <title>
      IAN – Leading Romanian Trap Artist | Official Music & Merch Store
    </title>

    <meta
      name="description"
      content="Official site of IAN – leading Romanian trap artist. Listen to Voodoo Chronicles Vol. 1 and shop exclusive merch."
    />

    <meta
      property="og:title"
      content="IAN – Leading Romanian Trap Artist | Official Music & Merch Store"
    />
    <meta
      property="og:description"
      content="Explore IAN's music catalog including 'Voodoo Chronicles Vol. 1' and shop exclusive merch drops."
    />
    <meta property="og:image" content="https://www.nusuntian.com/ian-bg.webp" />
    <meta property="og:url" content="https://www.nusuntian.com/" />
    <meta property="og:type" content="website" />

    <!-- Twitter cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IAN — Official Website" />
    <meta
      name="twitter:description"
      content="Explore IAN's music catalog and shop exclusive merch drops."
    />
    <meta
      name="twitter:image"
      content="https://www.nusuntian.com/ian-bg.webp"
    />

    <!-- Structured Data: MusicGroup/Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MusicGroup",
        "name": "IAN",
        "url": "https://www.nusuntian.com/",
        "image": "https://www.nusuntian.com/ian-bg.webp",
        "description": "Official site of IAN — Romania’s leading urban artist. Stream music and shop exclusive merch.",
        "foundingLocation": {
          "@type": "Place",
          "name": "Romania"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
